name: Build TGH C++ ASI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Unpack TGH_CPP_pack.zip
        shell: pwsh
        run: |
          # 清理可能残留的文件夹，防止报错
          if (Test-Path TGH_CPP) { Remove-Item -Recurse -Force TGH_CPP }
          # 使用更稳定的 tar 命令解压，替换掉容易报错的 Expand-Archive
          tar -xf TGH_CPP_pack.zip
          # 查看解压出来的结构
          Get-ChildItem TGH_CPP

      - name: Generate ScriptHook.lib from ScriptHook.def
        shell: cmd
        run: |
          cd TGH_CPP
          lib /nologo /def:ScriptHook.def /machine:x86 /out:ScriptHook.lib
          dir ScriptHook.lib

      - name: Compile TGHMod.asi
        shell: cmd
        run: |
          cd TGH_CPP
          # 注意这里用的是 *.cpp 通配符，会自动编译 src 文件夹里所有的 cpp 源码
          cl /nologo /LD /MT /EHsc /O2 /D_CRT_SECURE_NO_WARNINGS /I. src\*.cpp /link /MACHINE:X86 /OUT:TGHMod.asi ScriptHook.lib user32.lib
          dir TGHMod.asi

      - name: Upload ASI
        uses: actions/upload-artifact@v4
        with:
          name: TGHMod_asi
          path: TGH_CPP/TGHMod.asi
